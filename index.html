<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Name in Heart</title>
  <style>
    body {
      background-color: black;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: white;
      font-family: 'Courier New', Courier, monospace;
    }

    .heart-container {
      position: relative;
      width: 300px;
      height: 300px;
    }

    .heart {
      width: 100%;
      height: 100%;
      background: url('https://i.ibb.co/Vv6WRh5/heart-outline.png') no-repeat center;
      background-size: contain;
      animation: glow 1.5s infinite alternate;
    }

    .names {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 24px;
    }

    .heart-symbol {
      color: red;
      padding: 0 5px;
    }

    @keyframes glow {
      0% { filter: drop-shadow(0 0 5px hotpink); }
      100% { filter: drop-shadow(0 0 15px hotpink); }
    }
  </style>
</head>
<body>
  <div class="heart-container">
    <div class="heart"></div>
    <div class="names">
      Doremon <span class="heart-symbol">❤️</span> Nobita
    </div>
  </div>
</body>
</html>
